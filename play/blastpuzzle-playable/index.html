<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BlastPuzzle - Playable</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b2a7a; touch-action: none; }
    #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* Portrait 9:16 box that fills the screen on phones and sits centred on desktop. */
    #stage { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; }
    @media (max-aspect-ratio: 9/16) { #stage { width: 100%; height: auto; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #3446be; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               background: #3446be; color: #fff; font: 700 20px system-ui, sans-serif; gap: 16px; }
    #bar { width: 60%; height: 14px; border-radius: 7px; background: rgba(255,255,255,.25); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #ffd640; border-radius: 7px; transition: width .2s; }
  </style>
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>BLAST PUZZLE</div><div id="bar"><div id="fill"></div></div></div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Zeafkee",
      productName: "BlastPuzzle",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
      }).catch(function (e) { alert(e); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
